# Mantém o projeto grátis do Supabase acordado.
# O Supabase pausa projetos grátis depois de 7 dias sem uso; isto dá um "oi" a cada 3 dias.
# Usa só a chave pública (a mesma do config.js), nada secreto.
name: Manter Supabase acordado

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Oi, Supabase
        run: |
          URL="https://tcdsohxqqpktanfklpgi.supabase.co"
          KEY="sb_publishable_8kjom4laQuSN_9qCkIoZQg_HAZCgvdd"
          curl -sS -f -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
