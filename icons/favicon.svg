<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="85%">
      <stop offset="0" stop-color="#2a2438"/><stop offset=".55" stop-color="#14121c"/><stop offset="1" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="45%">
      <stop offset="0" stop-color="#e5b567" stop-opacity=".28"/><stop offset="1" stop-color="#e5b567" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8dc9f"/><stop offset=".5" stop-color="#e5b567"/><stop offset="1" stop-color="#c38a37"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7d6e0"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2236"/><stop offset="1" stop-color="#0f0d16"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="armclip"><rect x="222" y="270" width="580" height="122" rx="44"/></clipPath>
    <clipPath id="bgclip"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#bgclip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <g transform="translate(0 6) scale(1)">
      <!-- braço da claquete -->
      <g transform="rotate(-11 226 392)" filter="url(#sh)">
        <rect x="222" y="270" width="580" height="122" rx="44" fill="url(#arm)"/>
        <g clip-path="url(#armclip)" stroke="#1b1726" stroke-width="58" stroke-linecap="round">
          <path d="M330 240 L390 430"/><path d="M480 240 L540 430"/><path d="M630 240 L690 430"/>
        </g>
        <rect x="222" y="270" width="580" height="58" rx="29" fill="#fff" opacity=".35"/>
      </g>
      <!-- corpo -->
      <g filter="url(#sh)">
        <rect x="212" y="410" width="600" height="410" rx="88" fill="url(#gold)"/>
      </g>
      <rect x="212" y="410" width="600" height="410" rx="88" fill="url(#shine)"/>
      <rect x="214" y="412" width="596" height="406" rx="86" fill="none" stroke="#fff3d6" stroke-opacity=".5" stroke-width="4"/>
      <!-- play -->
      <path d="M470 532 L470 698 L606 615 Z" fill="#17131f" stroke="#17131f" stroke-width="44" stroke-linejoin="round"/>
    </g>
  </g>
</svg>