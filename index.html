<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cinemoteca">
<meta name="description" content="Sua lista de filmes e séries: busque, salve o que quer ver e nunca mais esqueça.">
<title>Cinemoteca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <header class="top">
    <div class="brand" aria-label="Cinemoteca">CINEMO<span>TECA</span></div>
    <button class="icon-btn" id="dice" title="Me sorteia um" aria-label="Me sorteia um filme da lista">🎲</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="bottom" aria-label="Navegação">
    <button data-tab="lista" class="on"><span class="ni">🎬</span><span>Minha lista</span></button>
    <button data-tab="buscar"><span class="ni">🔍</span><span>Buscar</span></button>
    <button data-tab="ajustes"><span class="ni">⚙️</span><span>Ajustes</span></button>
  </nav>

  <div class="sheet-bg" id="sheetBg"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalhes"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=10"></script>
  <script src="vendor/supabase.js?v=10"></script>
  <script type="module" src="app.js?v=10"></script>
</body>
</html>
