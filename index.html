<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cinemoteca">
<meta name="description" content="Sua lista de filmes e séries: busque, salve o que quer ver e nunca mais esqueça.">
<title>Cinemoteca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <header class="top">
    <div class="brand" aria-label="Cinemoteca"><svg class="pop" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="#f3d08e"><circle cx="9" cy="10" r="4.2"/><circle cx="15.5" cy="7.5" r="4.6"/><circle cx="22.5" cy="10" r="4.2"/><circle cx="12.5" cy="12" r="3.6"/><circle cx="19.5" cy="12" r="3.6"/></g>
      <g fill="#fff6e3"><circle cx="14" cy="6" r="1.6"/><circle cx="21" cy="8.6" r="1.3"/><circle cx="8" cy="8.8" r="1.2"/></g>
      <path d="M5 13.5h22l-2.6 16a1.6 1.6 0 0 1-1.6 1.3H9.2a1.6 1.6 0 0 1-1.6-1.3z" fill="#f4f4f6"/>
      <path d="M9.4 13.5h3.2l.9 17.3h-3zM15.2 13.5h3.2l-.4 17.3h-2.4zM21.2 13.5h3.2l-2.3 17.3h-2.2z" fill="#d6423a"/>
    </svg><b class="bt">CINEMO<span>TECA</span></b></div>
    <button class="icon-btn" id="dice" title="Me sorteia um" aria-label="Me sorteia um filme da lista">🎲</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="bottom" aria-label="Navegação">
    <button data-tab="lista" class="on"><span class="ni">🎬</span><span>Minha lista</span></button>
    <button data-tab="buscar"><span class="ni">🔍</span><span>Buscar</span></button>
    <button data-tab="amigos"><span class="ni">👥</span><span>Amigos</span></button>
    <button data-tab="ajustes"><span class="ni">⚙️</span><span>Ajustes</span></button>
  </nav>

  <div class="sheet-bg" id="sheetBg"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalhes"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=20"></script>
  <script src="vendor/supabase.js?v=20"></script>
  <script type="module" src="app.js?v=20"></script>
</body>
</html>
